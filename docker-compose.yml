# Docker self-hosting is independent of Cloudflare production.
# Change MUSIC_FOLDER and UPLOAD_FOLDER in .env or Portainer volume mapping.
services:
  riffvault:
    build: .
    image: riffvault:local
    container_name: riffvault
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      NODE_ENV: production
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      DEFAULT_SNI: ${DEFAULT_SNI:-localhost}
      TLS_ARGS: ${TLS_ARGS:-internal}
      SCANNER_SECRET: ${SCANNER_SECRET:-}
      MUSIC_SCAN_PATHS: /music
      MUSIC_SCAN_INTERVAL: ${MUSIC_SCAN_INTERVAL:-300}
    volumes:
      - riffvault-local-state:/app/.wrangler/state
      - ${MUSIC_FOLDER:-./music}:/music:ro
      - ${UPLOAD_FOLDER:-./uploads}:/data/uploads
      - riffvault-caddy-data:/data
      - riffvault-caddy-config:/config
      - ${CERT_DIR:-./certs}:/certs:ro
volumes:
  riffvault-local-state:
  riffvault-caddy-data:
  riffvault-caddy-config:
